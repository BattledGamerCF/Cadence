# The indie profile: Cadence's own near-terrain renderer, no Sodium. The default when neither -Dcadence.profile nor
# config/cadence.properties names a profile; profile=none turns it off (vanilla's renderer). A flag on the command line or in
# config/cadence.properties wins over these. Far terrain (cadence.lod) is NOT set: it stays an experimental opt-in.
# Thread QoS is the mod's default: not set here.

# Our near terrain (metal/OWN-RENDERER.md): compact vertices, 32-quad units, our translucent path (exact vs vanilla)
cadence.own=true
cadence.own.compact=true
# Reserve the measured RD16 backing on small GPUs only: Neo A18 Pro has 5 cores; M4 mini (10) and M6 (12) retain growth.
cadence.own.arena.preSize=true
cadence.own.arena.preSizeMaxCores=8
cadence.own.run=32
cadence.own.translucent=true
# Fragment-cost set (cutfirst left off): 8-quad size classes, lean vertex stage, tighter unit boxes
cadence.own.frag.sizes=true
cadence.own.frag.lean=true
cadence.own.frag.box=true
# colour varying as half4 (within 1 LSB of vanilla's picture; accepted)
cadence.own.frag.half=true
# The cull with 8 lanes per section (same lists in the same order), its command buffer started as soon as it is encoded
cadence.own.int.cullR=true
cadence.own.int.cullW=8
cadence.own.int.preEarly=true
# Our own block mesher on vanilla's models (exact vs vanilla; meshing CPU -37%)
cadence.own.mesh=true
cadence.own.mesh.region=true
cadence.own.mesh.tint=true
cadence.own.mesh.prefill=true
cadence.own.mesh.ao=true
# Exact compact positions (off-grid coordinates by table code): the picture 0 px > 8 vs vanilla
cadence.own.mesh.exactPos=true
# Solid and cutout layers as 40-byte quad records decoded by the vertex stage (exact)
cadence.own.mesh.qrec=true
# Translucent sections whose vertex box is wholly outside a side plane of the drawn frustum are left out (exact: their
# triangles are all clipped)
cadence.own.mesh.tfrustum=true
# The HUD vignette is skipped when its source is exactly black (it then changes no pixel): shader, pipeline and reload guarded
cadence.own.vignetteNoop=true
# Translucent quads facing away from the camera left out of the drawn order on the CPU (exact)
cadence.own.mesh.tcull=true
# Translucent stored in draw order + rich/lean half-colour split (exact; whole-run ABBA M6 flight +1.3%, mini spin +2.3%)
cadence.own.mesh.tsorted=true
cadence.own.mesh.thalf=true
# GPU unit occlusion (metal/OWN-RENDERER.md; all exact vs the plain frag path): 8-block cell units in cell order with two sub-boxes and
# size classes by bucket suffix (a unit takes the largest of it and the later units of its bucket: bucket order kept); the units visible at the last test drawn first, a depth pyramid (tiled, top levels in one
# threadgroup, mip 0 by gathers), every unit tested against it (fine=3, sub-boxes, the fast gathered test), the rest drawn after;
# two sets of per-frame buffers; phase A split at 216 blocks with the test after its later part
cadence.own.mesh.order=cell
cadence.own.mesh.cell=8
cadence.own.mesh.subbox=true
cadence.own.mesh.bucketClass=suffix
cadence.own.frag.uocc=true
cadence.own.frag.fine=3
cadence.own.frag.msub=true
cadence.own.frag.pipe=true
cadence.own.hizTop=true
cadence.own.hizGather=true
cadence.own.frag.splitNear=216
cadence.own.frag.testLate=true
cadence.own.frag.testFast=true
cadence.own.frag.testGather=true
# The uocc pyramid built from 4 x 4 pixel texels up (one level coarser: the test only gets more conservative; exact)
cadence.own.frag.pyrSkip=1
# Above 6 MP on GPUs of 12 cores or more, the frame without the unit occlusion (those draw it faster: measured per GPU)
cadence.own.frag.uoccMaxMp=6.0
cadence.own.frag.uoccMaxMpCores=12
# A2 drawn with exactly its quads (no padding) on GPUs of at most 7 cores (the Neo: flight +5.1%, late +9%, hold -1.0%); the
# gate line is mandatory (the code's default 0 means every GPU)
cadence.own.frag.a2Exact=true
cadence.own.frag.a2ExactMaxCores=7
# Promotion closure for identical-corner solid/cutout ties: fixes the one-frame grass overlay loss (exact; grass gate 0 vs 55 frames; M6 flight -0.3%)
cadence.own.frag.tieClose=true
# Phase A's first part as two render passes split inside its largest list (exact): on GPUs of at most 7 or at least 12 cores (the Neo
# and the M6), off on the mini's 10
cadence.own.tl.a1Split=30
cadence.own.tl.a1SplitMaxCores=7
cadence.own.tl.a1SplitMinCores=12
# Phase A's class draws grouped (2^2 units a draw, exact; fails closed to the plain class draws) on GPUs of at least 12 cores (the M6)
cadence.own.frag.vGroup=2
cadence.own.frag.vGroupMinCores=12
# With Fabric API present: its renderer reads blocks through our region copy (exact, meshing -22% per section)
cadence.own.mesh.frapiRegion=true
# Vanilla's per-frame section draw lists skipped while its buffers hold no terrain (exact, verified)
cadence.own.int.lists=true
# Block entities and our translucent list taken from the visible sections that have any, in vanilla's order (exact, verified)
cadence.own.int.visible=true
# A section's compile task drops its region copy once the compile is done (vanilla keeps it until the next compile: ~78 MB of live heap;
# nothing reads it after the compile, so no change in behaviour)
cadence.own.int.compileRegionDrop=true
# One-pass texture animation: a tick's animation draws in one pass into a scratch, one compute copy per atlas into its mips (exact),
# on GPUs with 8 or more cores only (its atlasWrite turns off the atlases' lossless compression: mini +12.6% spin 1% lows, M6 neutral,
# Neo -7% flight 1% lows, so the A18 Pro's 5 cores keep vanilla's per-mip passes)
cadence.own.int.animOnePass=true
cadence.own.int.atlasWrite=true
cadence.own.int.animMinCores=8
# A compile cancelled by a reset or a newer compile of its section doesn't publish its (older) mesh (OwnLife; reset and the store's
# check run under the dispatcher's lock, exception-safe)
cadence.own.int.lifeFix=true
# Far terrain hand-off from our terrain and no section fade while far terrain draws: they act only when cadence.lod=true
cadence.own.int.seam=true
cadence.lod.fade=instant
# Startup: narrator created lazily
cadence.startup.narrator=lazy

# The alpha profile's settings that don't need Sodium (all exact):
# the fence after a submit names that submit (no mid-frame GPU wait on the render thread); texel buffer views cached over the same
# memory; entity model compile reuse
cadence.cpu.fence=true
cadence.cpu.texelCache=true
cadence.cpu.model=true
# byte-identical region writes skipped
cadence.chunk.saveSkip=true
# Server side: POI search as loops, chunk ticking without per-pick overhead, the section index offset computed once; the light
# engine publishes a read-only snapshot of its section map instead of a copy per update
cadence.chunk.poi=true
cadence.chunk.ticks=true
cadence.chunk.chunkGet=true
cadence.alloc.lightMap=true
# Edge cap: fps capped at 2x refresh while the integrated server generates within RD+32 chunks; adaptive frame pacing
cadence.edgeCap=true
cadence.metal.paceAdapt=true
# Far terrain's settings, inert unless cadence.lod=true (the hand-off is our near terrain's seam, set above)
cadence.lod.render=mesh
cadence.lod.prio=screen
cadence.lod.publish=gpu
cadence.lod.nativeNoise=neon
cadence.lod.yield=missing:0

# Cadence Logic (Lithium-style game-logic optimizations, exact): entity searches by direct section lookup, mob brains
# without per-tick iterators. Steps aside when Lithium is installed. cadence.logic.<name>=false turns one off.
cadence.logic=true
