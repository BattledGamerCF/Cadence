# The recommended profile: the measured, accepted wins. Turn it on with profile=recommended in
# <game dir>/config/cadence.properties, or -Dcadence.profile=recommended. A flag given on the command line or in that
# file wins over the value here. Every setting here was measured on the test Macs before it was accepted.

# Far terrain (reach: the code default, 512 chunks), mesh renderer with the full cull. The lists (lod.pk) and
# the real-terrain occluder (lod.realOcc) stay opt-in.
cadence.lod=true
cadence.lod.render=mesh
# The seamless set: no fade-in, drawn hand-off, screen-priority streaming, GPU publish
cadence.lod.fade=instant
cadence.lod.handoff=drawn
cadence.lod.prio=screen
cadence.lod.publish=gpu
cadence.lod.handoffPush=0.9995
# Far terrain's noise on NEON, bit-exact with the game's
cadence.lod.nativeNoise=neon
# Far-terrain generation yields while the client lacks chunks in its render distance (real chunks no later than with far
# terrain off: 0 holes on both rigs)
cadence.lod.yield=missing:0
# Thread QoS (render interactive + server initiated) is the mod's default: not set here.
# Chunk pipeline: skip byte-identical region writes; the mesher's fast paths
cadence.chunk.saveSkip=true
cadence.chunk.mesh=all,biome
# Sodium section-clone cache of 4096 (mesh + visibility digest identical, 0 stale over 437,933 verified hits)
cadence.chunk.clones=4096
# Render-list walk with a region cache (-9% of readRenderListFromTree on the Neo)
cadence.cpu.lists=true
# Clone cache expiry walk stops at the first unexpired entry (behaviour-identical)
cadence.chunk.clonesCleanup=true
# Sodium lost-update fix: a cull scheduled while the graph changes is re-run
cadence.cpu.cullRecover=true
# Narrator created on first use
cadence.startup.narrator=lazy
cadence.cpu.texelCache=true
cadence.cpu.model=true
# The fence after a submit names that submit: no mid-frame GPU wait on the render thread (exact, 0 px) (both tiers)
cadence.cpu.fence=true
# Server-side switches (soak-tested, 0 issues): POI search as loops, chunk ticking without per-pick
# overhead, the section index offset computed once (all exact). chunk.light stays opt-in: it overlaps
# alloc.lightMap, and with alloc.lightMap on it switches itself off.
cadence.chunk.poi=true
cadence.chunk.ticks=true
cadence.chunk.chunkGet=true
# Light engine publishes a read-only snapshot of its section map instead of a copy per update
cadence.alloc.lightMap=true
# Edge cap: fps capped at 2x refresh while the integrated server generates within RD+32 chunks, so the render-distance edge
# isn't left missing in new terrain (both tiers)
cadence.edgeCap=true
# Adaptive frame pacing (both tiers): laptop 117-119 distinct frames/s vs 72-93,
# p50/p99 lower, fps per GHz flat; Neo fps and lows equal or up; mini inert
cadence.metal.paceAdapt=true

# Cadence Logic (Lithium-style game-logic optimizations, exact): entity searches by direct section lookup, mob brains
# without per-tick iterators. Steps aside when Lithium is installed. cadence.logic.<name>=false turns one off.
cadence.logic=true
