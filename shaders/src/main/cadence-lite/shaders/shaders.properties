# Cadence Lite: vanilla look, built for Apple chips. LOW runs on anything; ULTRA is the showcase.
# Passes that a profile doesn't use are switched off entirely, so they cost nothing.

profile.LOW    = !SHADOWS SUN_LIGHT:1 WATER:0 !WATER_SSR !BLOOM !GODRAYS !TONEMAP WAVING VIBRANCE:1.04 CONTRAST:1.00
profile.MEDIUM = SHADOWS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_FILTER:0 SUN_LIGHT:1 WATER:1 !WATER_SSR !BLOOM !GODRAYS !TONEMAP WAVING VIBRANCE:1.08 CONTRAST:1.02
profile.HIGH   = SHADOWS shadowMapResolution:2048 shadowDistance:96.0 SHADOW_FILTER:1 SUN_LIGHT:1 WATER:1 !WATER_SSR BLOOM BLOOM_STRENGTH:0.09 !GODRAYS TONEMAP WAVING VIBRANCE:1.14 CONTRAST:1.02
profile.ULTRA  = SHADOWS shadowMapResolution:3072 shadowDistance:160.0 SHADOW_FILTER:2 SUN_LIGHT:2 WATER:1 WATER_SSR BLOOM BLOOM_STRENGTH:0.12 GODRAYS GODRAY_SAMPLES:16 TONEMAP WAVING VIBRANCE:1.20 CONTRAST:1.05

screen = <profile> <empty> [LIGHT] [WATER_SCREEN] [POST] WAVING
screen.LIGHT = SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_STRENGTH SUN_LIGHT sunPathRotation
screen.WATER_SCREEN = WATER WATER_SSR
screen.POST = BLOOM BLOOM_STRENGTH GODRAYS GODRAY_SAMPLES TONEMAP VIBRANCE CONTRAST
sliders = shadowMapResolution shadowDistance SHADOW_STRENGTH BLOOM_STRENGTH GODRAY_SAMPLES VIBRANCE CONTRAST sunPathRotation

program.shadow.enabled = SHADOWS
program.composite.enabled = BLOOM || GODRAYS || WATER_SSR

blend.gbuffers_water.colortex3 = off
# Cadence HDR: this pack writes highlights above 1.0 itself (cadenceHdrPeak), so the loader doesn't expand its output
cadence.hdr = true

oldLighting = false
separateAo = false
underwaterOverlay = true
vignette = false
sun = true
moon = true
clouds = fancy
